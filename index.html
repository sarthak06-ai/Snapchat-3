<!DOCTYPE html>
<html>
<head>
  <title>SnapStyle Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: white;
      width: 320px;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
      text-align: center;
    }

    .logo {
      font-size: 40px;
      margin-bottom: 10px;
    }

    h2 {
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <div class="logo">👻</div>

    <h2>SnapStyle</h2>

    <input type="text" id="username" placeholder="Username">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Log In</button>

    <p class="note">
      Demo interface — no credentials are stored or sent.
    </p>
  </div>

  <script>
    function login() {
      const username = document.getElementById("username").value;

      if (username === "") {
        alert("Please enter a username.");
        return;
      }

      alert("Demo login successful!");
    }
  </script>
  # Example: safe demo data
username = input("Demo username: ")

if username:
    print("Demo login received:", username)

</body>
</html>
